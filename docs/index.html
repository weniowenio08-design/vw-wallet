<div id="splash" role="img" aria-label="Uiraçu, olho de harpia">
  <img class="sp-logo" src="icons/logo-grande.png" alt="" width="270" height="384">
  <div class="sp-name">uiraçu</div>
  <div class="sp-line"></div>
  <div class="sp-phrase">Veja de cima.<br>Ataque com calma.</div>
  <div class="sp-tag">olho de harpia</div>
</div>
</div>
<header>
  <a class="brand" id="brand" role="button" aria-label="Uiraçu: início">
    <img src="icons/logo.png" alt="" height="40" style="width:auto">
    <div><h1>Uiraçu</h1><div class="sub" id="upd">olho de harpia · carregando…</div></div>
  </a>
  <div class="hr"><button class="icbtn" id="btn-search" aria-label="Buscar ativos"></button><button class="icbtn" id="btn-tema" aria-label="Alternar tema claro e escuro"></button><button class="rgi" id="regime" aria-label="Estado do mercado: toque para entender">i</button></div>
</header>
<main id="view"><div class="skel"></div><div class="skel"></div><div class="skel"></div></main>
<nav id="tabs"></nav>

  <div id="s-res"></div>
</section>
<div id="sheet" aria-hidden="true"><div class="bk"></div><div class="pn" role="dialog" aria-label="Explicação"><div class="grab"></div><div id="sh-body"></div><button class="btn" id="sh-close">Entendi</button></div></div>
