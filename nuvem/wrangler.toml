name = "uiracu-nuvem"
main = "src/index.js"
compatibility_date = "2026-10-01"

# Cole aqui o id que o comando "wrangler d1 create uiracu" mostrar.
[[d1_databases]]
binding = "DB"
database_name = "uiracu"
database_id = "c41b8a84-f039-44a5-95e5-fbc2b9cd53f3"

# A cada hora cheia: confere quem pediu relatório automático neste dia e horário (Brasília).
[triggers]
crons = ["0 * * * *"]

[vars]
APP_ORIGIN = "https://weniowenio08-design.github.io"
MAX_USERS = "5"
VAPID_SUBJECT = "https://weniowenio08-design.github.io/vw-wallet/"
WA_TEMPLATE_REPORT = "relatorio_mensal"
AI_DAILY_LIMIT = "40"
# Preencha depois de criar o app na Meta (não são segredos):
WA_PHONE_ID = ""
WA_BOT_NUMBER = ""
VAPID_PUBLIC_KEY = "BGuORFRFwSRwMIoe4Y22AyQKkwHOYnkmGvMmRRH6Iurqu5pUkJ-WiXkLETOcrAfMYZQByp4YOuZzBSi5xerfLRI"
# Segredos (nunca neste arquivo): WA_TOKEN, WA_APP_SECRET, WA_VERIFY_TOKEN, VAPID_PRIVATE_JWK,
# GEMINI_API_KEY (opcional), BRAIN_SECRET, ALLOWED (números permitidos, ex.: 5581999990000,5581988880000)
